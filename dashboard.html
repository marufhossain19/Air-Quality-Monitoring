                        timestamp: currentTimestamp,
                        formattedDate: formattedDate
                    });
                }
            }

            // Check dust
            if (SensorData.isAboveThreshold(reading.dust, 'dust')) {
                const alertKey = 'dust_high';
                if (!isAlertAcknowledged(alertKey)) {
                    alerts.push({
                        type: 'dust',
                        key: alertKey,
                        title: 'High Dust Alert',
                        message: `Dust level has reached ${reading.dust.toFixed(1)} μg/m³, exceeding the safe threshold of 400 μg/m³.`,
                        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>',
                        timestamp: currentTimestamp,
                        formattedDate: formattedDate
                    });
                }
            }

            // Clean up acknowledged alerts that have returned to normal
            cleanupAcknowledgedAlerts(reading);

            // Display alerts if there are any and following the rules
            if (alerts.length > 0) {
                // If we have alerts to show and it's time to show them (initial alert or after 5 cycles)
                if (!currentAlert || alertUpdateCounter >= 5) {
                    alertUpdateCounter = 0; // Reset counter
                    showAlerts(alerts);
                }
            } else {
                // No thresholds exceeded, keep counting for cycles
                if (alertUpdateCounter >= 5) {
                    alertUpdateCounter = 0; // Reset counter after 5 cycles
                }
            }
        }

        // Function to format the date for alert display
        function formatAlertDate(date) {
            // Format: "13 April 2025 11:00 PM"
            const options = {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            };
            return date.toLocaleString('en-US', options);
        }

        // Function to check if an alert has been acknowledged
        function isAlertAcknowledged(alertKey) {
            return acknowledgedAlerts.hasOwnProperty(alertKey) &&
                (new Date().getTime() - acknowledgedAlerts[alertKey]) < (60 * 60 * 1000); // 1 hour cooldown
        }

        // Clean up acknowledged alerts that have returned to normal
        function cleanupAcknowledgedAlerts(reading) {
            // Remove acknowledged alerts for values that are now normal
            if (!SensorData.isAboveThreshold(reading.temperature, 'temperature') && acknowledgedAlerts.hasOwnProperty('temperature_high')) {
                delete acknowledgedAlerts.temperature_high;
            }

            if (reading.humidity <= 90 && acknowledgedAlerts.hasOwnProperty('humidity_high')) {
                delete acknowledgedAlerts.humidity_high;
            }

            if (reading.humidity >= 25 && acknowledgedAlerts.hasOwnProperty('humidity_low')) {
                delete acknowledgedAlerts.humidity_low;
            }

            if (!SensorData.isAboveThreshold(reading.lpg, 'lpg') && acknowledgedAlerts.hasOwnProperty('lpg_high')) {
                delete acknowledgedAlerts.lpg_high;
            }

            if (!SensorData.isAboveThreshold(reading.dust, 'dust') && acknowledgedAlerts.hasOwnProperty('dust_high')) {
                delete acknowledgedAlerts.dust_high;
            }
        }

        // Function to display alerts
        function showAlerts(alerts) {
            const alertContainer = document.getElementById('alert-container');

            // If there's already an alert showing and the user hasn't closed it yet, remove it
            // to show the new one (alert update after 5 cycles)
            if (currentAlert) {
                alertContainer.innerHTML = '';
            }

            // Create the alert backdrop and box
            const alertBackdrop = document.createElement('div');
            alertBackdrop.className = 'alert-backdrop';

            // Create a group alert if there are multiple alerts
            if (alerts.length > 1) {
                const alertBox = document.createElement('div');
                alertBox.className = 'alert-box multiple';

                // Use the timestamp from the most recent alert
                const mostRecentDate = alerts.reduce((latest, alert) =>
                    alert.timestamp > latest ? alert.timestamp : latest,
                    alerts[0].timestamp
                );

                const formattedDate = formatAlertDate(mostRecentDate);
                const alertKeysArray = JSON.stringify(alerts.map(a => a.key));

                let alertContent = `
                    <div class="alert-header">
                        <div class="alert-icon-circle">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                        </div>
                        <div class="alert-title">Multiple Alerts Detected</div>
                        <div class="alert-date">${formattedDate}</div>
                        <button class="alert-close" id="multiple-alert-close">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="alert-body">
                        <div class="alert-message">
                `;

                alerts.forEach(alert => {
                    alertContent += `<strong>${alert.title}:</strong> ${alert.message}<br><br>`;
                });

                alertContent += `
                        </div>
                        <button class="alert-button" id="multiple-alert-button">Acknowledge</button>
                    </div>
                `;

                alertBox.innerHTML = alertContent;
                alertBackdrop.appendChild(alertBox);

                // Add event listeners after the element is added to the DOM
                setTimeout(() => {
                    const closeBtn = document.getElementById('multiple-alert-close');
                    const acknowledgeBtn = document.getElementById('multiple-alert-button');

                    if (closeBtn) {
                        closeBtn.addEventListener('click', () => {
                            acknowledgeAlerts(alerts.map(a => a.key));
                        });
                    }

                    if (acknowledgeBtn) {
                        acknowledgeBtn.addEventListener('click', () => {
                            acknowledgeAlerts(alerts.map(a => a.key));
                        });
                    }
                }, 0);

            } else if (alerts.length === 1) {
                // Just show the single alert
                const alert = alerts[0];
                const alertBox = document.createElement('div');
                alertBox.className = `alert-box ${alert.type}`;

                alertBox.innerHTML = `
                    <div class="alert-header">
                        <div class="alert-icon-circle">
                            ${alert.icon}
                        </div>
                        <div class="alert-title">${alert.title}</div>
                        <div class="alert-date">${alert.formattedDate}</div>
                        <button class="alert-close" id="single-alert-close">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="alert-body">
                        <div class="alert-message">${alert.message}</div>
                        <button class="alert-button" id="single-alert-button">Acknowledge</button>
                    </div>
                `;

                alertBackdrop.appendChild(alertBox);

                // Add event listeners after the element is added to the DOM
                setTimeout(() => {
                    const closeBtn = document.getElementById('single-alert-close');
                    const acknowledgeBtn = document.getElementById('single-alert-button');

                    if (closeBtn) {
                        closeBtn.addEventListener('click', () => {
                            acknowledgeAlerts([alert.key]);
                        });
                    }

                    if (acknowledgeBtn) {
                        acknowledgeBtn.addEventListener('click', () => {
                            acknowledgeAlerts([alert.key]);
                        });
                    }
                }, 0);
            }

            alertContainer.appendChild(alertBackdrop);
            currentAlert = alerts;
        }

        // Function to acknowledge alerts and prevent them from showing again for a period
        function acknowledgeAlerts(alertKeys) {
            const now = new Date().getTime();

            // Mark each alert as acknowledged with the current timestamp
            alertKeys.forEach(key => {
                acknowledgedAlerts[key] = now;
            });

            // Close the alert window
            closeAlert();
        }

        // Function to close the alert
        function closeAlert() {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';
            currentAlert = null;
            alertUpdateCounter = 0; // Reset the counter when alert is closed
        }

        // Make functions globally available
        window.closeAlert = closeAlert;
        window.acknowledgeAlerts = acknowledgeAlerts;

        // Event listeners for chart filter buttons
        document.querySelectorAll('.chart-controls .filter-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const metric = this.dataset.metric;
                const parent = this.closest('.card-body');
                const chartId = parent.querySelector('canvas').id;

                // Update active button
                parent.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Update chart based on type - fetch only fresh data from database
                if (chartId === 'recent-chart') {
                    currentRecentMetric = metric;
                    // Fetch fresh data from database 
                    SensorData.getLast5Readings().then(data => {
                        window.cachedLast5Readings = data;
                        initRecentChart(data, metric);
                    });
                } else if (chartId === 'weekly-chart') {
                    currentWeeklyMetric = metric;
                    // Fetch fresh data from database
                    SensorData.getWeeklyAverages().then(data => {
                        window.cachedWeeklyData = data;
                        initWeeklyChart(data, metric);
                    });
                } else if (chartId === 'monthly-chart') {
                    currentMonthlyMetric = metric;
                    // Fetch fresh data from database
                    SensorData.getMonthlyAverages().then(data => {
                        window.cachedMonthlyData = data;
                        initMonthlyChart(data, metric);
                    });
                }
            });
        });

        // Event listener for refresh button
        refreshBtn.addEventListener('click', fetchAndUpdateData);

        // Event listener for settings button
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('show');
        });

        // Close settings dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!settingsBtn.contains(e.target) && !settingsDropdown.contains(e.target)) {
                settingsDropdown.classList.remove('show');
            }
        });

        // Event listener for logout button
        logoutBtn.addEventListener('click', function () {
            logoutUser(); // From auth.js
        });

        // Initialize the dashboard
        async function initDashboard() {
            await initUserProfile();
            await fetchAndUpdateData();

            // Initialize with online status
            isSystemOnline = true;
            updateConnectionStatus(true);

            // Reset any previous state
            lastFetchedReadings = [];
            consecutiveIdenticalReadings = 0;

            // Set up auto-refresh (every 8 seconds)
            setInterval(fetchAndUpdateData, 8 * 1000);
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initDashboard);

        // Add mobile menu functionality
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenuDropdown = document.getElementById('mobile-menu-dropdown');
        const mobileUserFullName = document.getElementById('mobile-user-fullname');
        const mobileLogoutBtn = document.getElementById('mobile-logout-btn');

        // Update mobile user name
        function updateMobileUserName(name) {
            mobileUserFullName.textContent = name;
        }

        // Toggle mobile menu
        mobileMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenuDropdown.classList.toggle('show');
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!mobileMenuBtn.contains(e.target) && !mobileMenuDropdown.contains(e.target)) {
                mobileMenuDropdown.classList.remove('show');
            }
        });

        // Mobile logout button click
        mobileLogoutBtn.addEventListener('click', () => {
            logoutUser();
        });
    </script>
</body>

</html>
