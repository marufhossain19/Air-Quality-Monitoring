<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AirQuality Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%231a2a6c'/%3E%3Cpath fill='rgba(255, 255, 255, 0.7)' d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z' transform='scale(0.6) translate(8, 8)'/%3E%3C/svg%3E"
        type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #08095b, #13a9df);
            background-size: 300% 300%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gradient 15s ease infinite;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Outermost circle with only border */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 97vmin;
            height: 97vmin;
            border-radius: 50%;
            border: 2px solid rgba(19, 169, 223, 0.15);
            box-shadow: 0 0 30px rgba(19, 169, 223, 0.1);
            z-index: -3;
            animation: borderPulse 10s ease-in-out infinite;
        }

        /* Middle circle */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.4) 0%, rgba(17, 24, 39, 0.2) 70%, rgba(10, 15, 25, 0.1) 100%);
            box-shadow: 0 0 30px rgba(19, 169, 223, 0.2);
            z-index: -2;
            animation: outerGlow 8s ease-in-out infinite;
        }

        /* Inner circle - using a pseudo-element of body for better positioning */
        .inner-circle {
            display: none;
        }

        /* Animated dots */
        .orbiting-dot {
            position: absolute;
            top: calc(50% - 5px);
            /* Half the height to center perfectly */
            left: calc(50% - 5px);
            /* Half the width to center perfectly */
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform-origin: 5px 5px;
            /* Center of the dot */
            z-index: -1;
        }

        .orbiting-dot:nth-child(1) {
            background-color: #ffffff;
            animation: orbit 18s linear infinite;
        }

        .orbiting-dot:nth-child(2) {
            background-color: #4cd2ff;
            animation: orbit-reverse 20s linear infinite;
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg) translateX(48.5vmin);
            }

            to {
                transform: rotate(360deg) translateX(48.5vmin);
            }
        }

        @keyframes orbit-reverse {
            from {
                transform: rotate(0deg) translateX(48.5vmin);
            }

            to {
                transform: rotate(-360deg) translateX(48.5vmin);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes borderPulse {

            0%,
            100% {
                border-color: rgba(19, 169, 223, 0.15);
                box-shadow: 0 0 30px rgba(19, 169, 223, 0.1);
            }

            50% {
                border-color: rgba(19, 169, 223, 0.3);
                box-shadow: 0 0 50px rgba(19, 169, 223, 0.2);
            }
        }

        @keyframes outerGlow {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(19, 169, 223, 0.2);
            }

            50% {
                box-shadow: 0 0 50px rgba(19, 169, 223, 0.3);
            }
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Responsive adjustments for the circles */
        @media (max-width: 768px) {
            body::before {
                width: 110vmin;
                height: 110vmin;
            }

            body::after {
                width: 90vmin;
                height: 90vmin;
            }

            @keyframes orbit {
                from {
                    transform: rotate(0deg) translateX(55vmin);
                }

                to {
                    transform: rotate(360deg) translateX(55vmin);
                }
            }

            @keyframes orbit-reverse {
                from {
                    transform: rotate(0deg) translateX(55vmin);
                }

                to {
                    transform: rotate(-360deg) translateX(55vmin);
                }
            }
        }

        /* Ensure better visibility on very small screens */
        @media (max-width: 480px) {
            .orbiting-dot {
                width: 8px;
                height: 8px;
                top: calc(50% - 4px);
                left: calc(50% - 4px);
                transform-origin: 4px 4px;
            }
        }

        .auth-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            width: 90%;
            max-width: 380px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .auth-logo {
            width: 50px;
            height: 50px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4158D0, #08095b);
            border-radius: 50%;
            padding: 12px;
        }

        .auth-logo svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
        }

        .instruction-text {
            color: #000000;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .auth-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-field {
            position: relative;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            padding: 12px;
        }

        .form-field:focus-within {
            border-color: #4158D0;
            border-width: 2px;
            box-shadow: none;
            background-color: #fff;
        }

        label {
            display: none;
        }

        input {
            width: 100%;
            padding: 0;
            border: none;
            border-radius: 0;
            font-size: 0.95rem;
            background-color: transparent;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: transparent;
            outline: none;
            box-shadow: none;
            background-color: transparent;
        }

        input::placeholder {
            color: #666;
            font-size: 0.9rem;
        }

        .form-error {
            color: #e53935;
            font-size: 0.8rem;
            margin: 0 0 12px 0;
            min-height: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            text-align: center;
        }

        .form-error:not(:empty) {
            min-height: 20px;
            max-height: 60px;
            padding: 4px 0;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4158D0, #08095b);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            box-shadow: none;
            transform: translateY(0);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .auth-links {
            margin-top: 18px;
            color: #666;
            font-size: 0.85rem;
            text-align: center;
        }

        .auth-links a {
            color: #4158D0;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .auth-links a:hover {
            color: #3b51b3;
            text-decoration: underline;
        }

        .btn-link {
            background: none;
            border: none;
            color: #4158D0;
            padding: 0;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            color: #3b51b3;
            text-decoration: underline;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-loading .spinner {
            display: inline-block;
        }

        .btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* OTP input styling */
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .otp-input {
            width: 40px;
            height: 40px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            background-color: white;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            border-color: #4158D0;
            box-shadow: 0 0 0 2px rgba(65, 88, 208, 0.2);
            outline: none;
        }

        .hidden-section {
            display: none;
        }

        .password-helper {
            font-size: 0.7rem;
            color: #53a2df;
            margin-top: 4px;
            transition: all 0.3s ease;
            margin-bottom: 0;
        }

        /* Success animation */
        @keyframes success-pulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            color: #4caf50;
            font-size: 50px;
            margin: 0 auto 15px;
            width: 60px;
            height: 60px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: success-pulse 0.6s forwards;
        }

        /* Shake animation for errors */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }

        .shake {
            animation: shake 0.6s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
                width: 95%;
            }

            h1 {
                font-size: 1.4rem;
                margin-bottom: 16px;
            }

            .auth-logo {
                width: 45px;
                height: 45px;
            }

            .otp-input {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
        }

        /* Section visibility */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Resend link */
        .resend-link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .resend-link button {
            background: none;
            border: none;
            color: #4158D0;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .resend-link button:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="orbiting-dot"></div>
    <div class="orbiting-dot"></div>
    <div class="auth-container">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zM8 13h2.55v3h2.9v-3H16l-4-4z" />
            </svg>
        </div>

        <!-- Email Section -->
        <div id="email-section" class="section active">
            <h1>Forgot Password</h1>
            <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 0.9rem;">
                Enter your email address below and we'll send you an OTP to reset your password.
            </p>

            <div class="auth-form">
                <div class="form-group">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                </div>

                <div class="form-error" id="email-error"></div>
                <div class="form-success" id="email-success"></div>

                <button type="button" id="send-otp-btn" class="btn-primary">
                    Send OTP
                    <span class="spinner"></span>
                </button>
            </div>
        </div>

        <!-- OTP Verification Section -->
        <div id="otp-section" class="section">
            <h1>Enter OTP</h1>
            <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 0.9rem;">
                Enter the verification code we just sent to your email.
            </p>

            <div class="auth-form">
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" id="otp-1" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp-2" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp-3" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp-4" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp-5" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" id="otp-6" autocomplete="off">
                </div>

                <div class="form-error" id="otp-error"></div>
                <div class="form-success" id="otp-success"></div>

                <button type="button" id="verify-otp-btn" class="btn-primary">
                    Verify OTP
                    <span class="spinner"></span>
                </button>

                <div class="resend-link">
                    Didn't receive code? <button id="resend-otp-btn">Resend OTP</button>
                </div>
            </div>
        </div>

        <!-- Reset Password Section -->
        <div id="reset-section" class="section">
            <h1>Reset Password</h1>
            <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 0.9rem;">
                Please enter your new password below.
            </p>

            <div class="auth-form">
                <div class="form-group">
                    <div class="form-field">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="new-password" placeholder="New Password"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm Password" required>
                    </div>
                </div>

                <div class="form-error" id="reset-error"></div>
                <div class="form-success" id="reset-success"></div>

                <button type="button" id="reset-btn" class="btn-primary">
                    Reset Password
                    <span class="spinner"></span>
                </button>
            </div>
        </div>

        <!-- Success Section -->
        <div id="success-section" class="section">
            <div style="text-align: center; margin-bottom: 20px;">
                
                    <circle cx="12" cy="12" r="11" fill="#f0f9ff" stroke="#4caf50" stroke-width="2"></circle>
                    <path fill="#4caf50" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                </svg>
            </div>
            <h1>Successful!</h1>
            <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 0.9rem;">
                Your password has been reset successfully.
            </p>

            <button type="button" id="login-btn" class="btn-primary">
                Go to Login
            </button>
        </div>
    </div>

    <script src="js/auth.js"></script>

    <script>
        // DOM Elements - Email Section
        const emailSection = document.getElementById('email-section');
        const emailInput = document.getElementById('email');
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const emailError = document.getElementById('email-error');
        const emailSuccess = document.getElementById('email-success');

        // DOM Elements - OTP Section
        const otpSection = document.getElementById('otp-section');
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const resendOtpBtn = document.getElementById('resend-otp-btn');
        const otpError = document.getElementById('otp-error');
        const otpSuccess = document.getElementById('otp-success');

        // DOM Elements - Reset Password Section
        const resetSection = document.getElementById('reset-section');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const resetBtn = document.getElementById('reset-btn');
        const resetError = document.getElementById('reset-error');
        const resetSuccess = document.getElementById('reset-success');

        // DOM Elements - Success Section
        const successSection = document.getElementById('success-section');
        const loginBtn = document.getElementById('login-btn');

        // Event Listeners - Email Section
        sendOtpBtn.addEventListener('click', handleSendOTP);
        emailInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSendOTP();
            }
        });

        // Event Listeners - OTP Section
        verifyOtpBtn.addEventListener('click', handleVerifyOTP);
        resendOtpBtn.addEventListener('click', handleSendOTP);

        // Event Listeners - Reset Password Section
        resetBtn.addEventListener('click', handleResetPassword);
        confirmPasswordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleResetPassword();
            }
        });

        // Event Listeners - Success Section
        loginBtn.addEventListener('click', function () {
            window.location.href = 'login.html';
        });

        // OTP input handling
        otpInputs.forEach((input, index) => {
            input.addEventListener('keyup', function (e) {
                // Only allow numbers
                this.value = this.value.replace(/[^0-9]/g, '');

                // Move to next input if value is entered
                if (e.key !== 'Backspace' && input.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                // Move to previous input on backspace if current input is empty
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }

                // Check if all inputs are filled
                const allFilled = Array.from(otpInputs).every(input => input.value);
                if (allFilled) {
                    verifyOtpBtn.focus();
                }
            });

            input.addEventListener('paste', function (e) {
                e.preventDefault();
                const clipboardData = e.clipboardData || window.clipboardData;
                const pastedData = clipboardData.getData('Text').trim();

                if (/^\d{6}$/.test(pastedData)) {
                    // If pasted data is 6 digits, fill all inputs
                    otpInputs.forEach((input, i) => {
                        input.value = pastedData[i] || '';
                    });
                    verifyOtpBtn.focus();
                }
            });
        });

        // Function to show a specific section
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }

        // Handle send OTP
        async function handleSendOTP() {
            // Clear previous errors/messages
            emailError.textContent = '';
            emailSuccess.textContent = '';

            const email = emailInput.value.trim();

            // Validate email
            if (!email) {
                showError(emailError, 'Please enter your email address');
                emailInput.focus();
                return;
            }

            if (!isValidEmail(email)) {
                showError(emailError, 'Please enter a valid email address');
                emailInput.focus();
                return;
            }

            // Show loading
            sendOtpBtn.classList.add('btn-loading');
            sendOtpBtn.disabled = true;

            try {
                const result = await forgotPassword(email);

                if (result.success) {
                    // Move to OTP section
                    showSection('otp-section');
                    otpInputs[0].focus();

                    // Clear OTP inputs
                    otpInputs.forEach(input => {
                        input.value = '';
                    });
                } else {
                    showError(emailError, result.message || 'Failed to send OTP. Please try again.');
                }
            } catch (error) {
                console.error('Send OTP error:', error);
                showError(emailError, 'An error occurred. Please try again later.');
            } finally {
                sendOtpBtn.classList.remove('btn-loading');
                sendOtpBtn.disabled = false;
            }
        }

        // Handle verify OTP
        async function handleVerifyOTP() {
            // Clear previous errors/messages
            otpError.textContent = '';
            otpSuccess.textContent = '';

            // Get OTP - ensure it's a string and trim any whitespace
            const otp = Array.from(otpInputs).map(input => input.value.trim()).join('');
            console.log('Sending OTP for verification:', otp);

            // Validate OTP
            if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
                showError(otpError, 'Please enter a valid 6-digit OTP');
                otpInputs[0].focus();
                return;
            }

            // Get email from session storage
            const email = sessionStorage.getItem('resetEmail');
            if (!email) {
                showError(otpError, 'Email not found. Please restart the process.');
                setTimeout(() => showSection('email-section'), 2000);
                return;
            }

            console.log('Verifying OTP for email:', email);

            // Show loading
            verifyOtpBtn.classList.add('btn-loading');
            verifyOtpBtn.disabled = true;

            try {
                const result = await verifyOTP(email, otp);
                console.log('OTP verification result:', result);

                if (result.success) {
                    // Move to reset password section
                    showSection('reset-section');
                    newPasswordInput.focus();
                } else {
                    showError(otpError, result.message || 'Invalid OTP. Please try again.');
                }
            } catch (error) {
                console.error('Verify OTP error:', error);
                showError(otpError, 'An error occurred. Please try again later.');
            } finally {
                verifyOtpBtn.classList.remove('btn-loading');
                verifyOtpBtn.disabled = false;
            }
        }

        // Handle reset password
        async function handleResetPassword() {
            // Clear previous errors/messages
            resetError.textContent = '';
            resetSuccess.textContent = '';

            // Get passwords
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate passwords
            if (!newPassword) {
                showError(resetError, 'Please enter your new password');
                newPasswordInput.focus();
                return;
            }

            if (newPassword.length < 8) {
                showError(resetError, 'Password must be at least 8 characters long');
                newPasswordInput.focus();
                return;
            }

            if (newPassword !== confirmPassword) {
                showError(resetError, 'Passwords do not match');
                confirmPasswordInput.focus();
                return;
            }

            // Get tempToken from session storage
            const tempToken = sessionStorage.getItem('tempToken');
            if (!tempToken) {
                showError(resetError, 'Session expired. Please restart the process.');
                setTimeout(() => showSection('email-section'), 2000);
                return;
            }

            // Show loading
            resetBtn.classList.add('btn-loading');
            resetBtn.disabled = true;

            try {
                const result = await resetPassword(tempToken, newPassword);

                if (result.success) {
                    // Move to success section
                    showSection('success-section');
                } else {
                    showError(resetError, result.message || 'Failed to reset password. Please try again.');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showError(resetError, 'An error occurred. Please try again later.');
            } finally {
                resetBtn.classList.remove('btn-loading');
                resetBtn.disabled = false;
            }
        }

        // Helper function to show error
        function showError(element, message) {
            element.textContent = message;
            element.parentElement.classList.add('shake');

            setTimeout(() => {
                element.parentElement.classList.remove('shake');
            }, 600);
        }

        // Email validation function
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
