<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirQuality Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%231a2a6c'/%3E%3Cpath fill='rgba(255, 255, 255, 0.7)' d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z' transform='scale(0.6) translate(8, 8)'/%3E%3C/svg%3E"
        type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #08095b, #13a9df);
            background-size: 400% 400%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .splash-container {
            text-align: center;
            color: white;
        }

        .logo {
            width: 180px;
            height: 180px;
            position: relative;
            margin: 0 auto 30px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.7);
            width: 100%;
            height: 100%;
            transform-origin: center;
            animation: pulse 2s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            animation-delay: -0.5s;
        }

        .circle:nth-child(2) {
            width: 70%;
            height: 70%;
            left: 15%;
            top: 15%;
            animation-delay: -0.3s;
        }

        .circle:nth-child(3) {
            width: 40%;
            height: 40%;
            left: 30%;
            top: 30%;
            animation-delay: -0.1s;
        }

        .icon {
            position: absolute;
            width: 20%;
            height: 20%;
            left: 40%;
            top: 40%;
            animation: fadeIn 1s forwards, floatIcon 3s ease-in-out infinite 1s;
            opacity: 0;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.7);
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.7;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-5px) scale(1.1);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0;
            animation: slideUp 1s forwards 0.5s;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0;
            animation: slideUp 1s forwards 0.8s;
        }

        .progress {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            animation: loading 3s forwards cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes loading {
            0% {
                width: 0;
            }

            30% {
                width: 50%;
            }

            60% {
                width: 75%;
            }

            100% {
                width: 100%;
            }
        }

        .fade-out {
            animation: fadeOut 0.8s forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <div class="logo">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zM8 13h2.55v3h2.9v-3H16l-4-4z" />
                </svg>
            </div>
        </div>
        <h1>Air Quality Monitoring System</h1>
        <p>Monitoring air quality in real-time</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        // Redirect to login page after animation completes
        setTimeout(function () {
            document.querySelector('.splash-container').classList.add('fade-out');
            setTimeout(function () {
                window.location.href = 'login.html';
            }, 800);
        }, 3500);
    </script>
</body>

</html>
